name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: 'URL ZIP project Flutter (dari GitHub Release)'
        required: true
      tag:
        description: 'Tag build (buat penamaan artifact)'
        required: true
      build_type:
        description: 'debug atau release'
        required: true
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project ZIP
        run: curl -L "${{ github.event.inputs.zip_url }}" -o project.zip

      - name: Extract project
        run: |
          mkdir -p flutter_project
          unzip -q project.zip -d _extracted

          # Kalau ZIP-nya punya 1 folder pembungkus di dalamnya, masuk ke situ.
          # Kalau pubspec.yaml langsung ada di root ZIP, pakai itu apa adanya.
          if [ -f "_extracted/pubspec.yaml" ]; then
            mv _extracted/* flutter_project/ 2>/dev/null || true
            mv _extracted/.[!.]* flutter_project/ 2>/dev/null || true
          else
            INNER=$(find _extracted -maxdepth 1 -mindepth 1 -type d | head -n1)
            if [ -n "$INNER" ] && [ -f "$INNER/pubspec.yaml" ]; then
              mv "$INNER"/* flutter_project/ 2>/dev/null || true
              mv "$INNER"/.[!.]* flutter_project/ 2>/dev/null || true
            else
              echo "::error::pubspec.yaml tidak ditemukan di dalam ZIP!"
              exit 1
            fi
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get dependencies
        working-directory: flutter_project
        run: flutter pub get

      - name: Build APK (debug)
        if: ${{ github.event.inputs.build_type == 'debug' }}
        working-directory: flutter_project
        run: flutter build apk --debug

      - name: Build APK (release)
        if: ${{ github.event.inputs.build_type != 'debug' }}
        working-directory: flutter_project
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-${{ github.event.inputs.tag }}
          path: flutter_project/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
          if-no-files-found: error
