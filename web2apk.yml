name: Build Web2APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'URL website yang mau dibungkus jadi APK'
        required: true
      app_name:
        description: 'Nama aplikasi'
        required: true
      icon_url:
        description: 'URL icon (PNG)'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Flutter WebView project
        run: |
          flutter create --org com.web2apk --project-name web2apk_app webapp
          cd webapp
          flutter pub add webview_flutter

      - name: Write main.dart (WebView wrapper)
        run: |
          cat > webapp/lib/main.dart << 'DARTEOF'
          import 'package:flutter/material.dart';
          import 'package:webview_flutter/webview_flutter.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return const MaterialApp(
                debugShowCheckedModeBanner: false,
                home: WebViewPage(),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController controller;

            @override
            void initState() {
              super.initState();
              controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..loadRequest(Uri.parse('WEB_URL_PLACEHOLDER'));
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                body: SafeArea(child: WebViewWidget(controller: controller)),
              );
            }
          }
          DARTEOF
          sed -i "s|WEB_URL_PLACEHOLDER|${{ github.event.inputs.web_url }}|g" webapp/lib/main.dart

      - name: Set app name
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          sed -i 's|android:label="[^"]*"|android:label="'"$APP_NAME"'"|' \
            webapp/android/app/src/main/AndroidManifest.xml

      - name: Download & apply icon
        run: |
          cd webapp
          curl -L "${{ github.event.inputs.icon_url }}" -o icon.png
          flutter pub add --dev flutter_launcher_icons
          cat > flutter_launcher_icons.yaml << 'ICONEOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "icon.png"
          ICONEOF
          flutter pub get
          dart run flutter_launcher_icons

      - name: Build APK
        working-directory: webapp
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-build
          path: webapp/build/app/outputs/flutter-apk/*.apk
          retention-days: 1
          if-no-files-found: error
